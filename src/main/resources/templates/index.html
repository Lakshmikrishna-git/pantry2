<!DOCTYPE HTML>
<html xmlns:th="http://thymeleaf.org">
    <head>
        <title> Login Page </title>

        <meta charset="utf-8">
        <meta name="viewport" content ="width=device-width, initial-scale=1.0">
    </head>

    <body>
        <div class="container">
            <form method="POST" action="/loginUser" class="card-1">
                <input type="text" class="inp-text" name="username" placeholder="username">
                <input type="password" class="inp-text" name="password" placeholder="password">
                <input type="submit" class="inpt-btn" value="Log In">
            </form>
        </div>
    </body>
</html>
